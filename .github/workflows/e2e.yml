name: E2E Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Edge Function の共有ロジックは gitignore 対象の生成物のため、
      # クリーンチェックアウトには存在しない。config.toml が宣言している関数を
      # supabase start がバンドルしようとして落ちるので、先に生成しておく。
      - name: Build Edge Functions
        run: npm run functions:build

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Export Supabase keys
        run: |
          eval $(supabase status --output env)
          echo "SUPABASE_SECRET_KEY=$SECRET_KEY" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> $GITHUB_ENV

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # e2e/ にテストが1本も無い間は "No tests found" で落ちる。常時赤いと本物の
      # 失敗が埋もれるため、0本を許容する。実テストが入れば通常どおり検証される（#37〜#39）
      - name: Run E2E tests
        run: npm run test:e2e -- --pass-with-no-tests

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop
